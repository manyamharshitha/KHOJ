# Generated by the Firebase CLI (https://github.com/firebase/firebase-tools),
# then corrected for this repository's layout: the web app lives in frontend/,
# not at the repository root. Run at the root, there is no package.json, so the
# install step printed its usage text and exited 1 before anything was built.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # A dependency requires Node 22.22 or newer; the runner's default Node is older.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # Vite bakes these into the bundle at build time. A secret or variable that
      # is not set arrives as an empty string: the build still succeeds, but the
      # deployed app is missing that setting (for Firebase sign-in, all six).
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://khoj-zgkq.onrender.com
          VITE_API_BASE_URL: https://khoj-zgkq.onrender.com
          VITE_FIREBASE_PROJECT_ID: khoj-cd80b
          VITE_FIREBASE_AUTH_DOMAIN: khoj-cd80b.firebaseapp.com
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_DEMO_VIDEO_URL: ${{ vars.VITE_DEMO_VIDEO_URL }}
        run: npm run build

      # Publishes frontend/dist, as set in firebase.json at the repository root.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KHOJ_CD80B }}
          channelId: live
          projectId: khoj-cd80b
