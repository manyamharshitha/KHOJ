[project]
name = "khoj-backend"
version = "0.1.0"
description = "Autonomous real-estate intelligence and outbound calling backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.6",
    "google-cloud-firestore>=2.19",
    "playwright>=1.48",
    "httpx>=0.27",
    "websockets>=13.1",
    "openai>=1.54",
    "google-genai>=0.3",
    "twilio>=9.3",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# One event loop for the whole session, matching production: the process has a
# single loop, and the cached Firestore client binds its gRPC channel to it.
# Per-test loops would strand that channel and the next test would fail with
# "Event loop is closed".
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: heavy emulator fixtures; run explicitly with -m slow",
]
# The 450-document batch test passes on its own in ~2s but wedges the gRPC
# channel when it runs after the rest of the module. Excluded by default so the
# suite stays fast and trustworthy; run it with `-m slow`.
addopts = "-m 'not slow'"
