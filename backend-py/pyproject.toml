[project]
name = "khoj-backend"
version = "0.1.0"
description = "Autonomous real-estate intelligence and outbound calling backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "firebase-admin>=6.6",
    "google-cloud-firestore>=2.19",
    "playwright>=1.48",
    "httpx>=0.27",
    "websockets>=13.1",
    "openai>=1.54",
    "google-genai>=0.3",
    "twilio>=9.3",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
