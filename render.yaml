services:
  - type: web
    name: khoj-api
    runtime: python
    plan: starter          
    region: singapore      
    rootDir: backend-py
    branch: main

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENV
        value: prod
      # Set to the Render URL once the service exists.
      - key: PUBLIC_URL
        sync: false
      # The Vercel origin. CORS is an explicit allowlist, so a wrong value here
      # means every browser request fails preflight.
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FIRESTORE_ENTERPRISE_URI
        sync: false
      - key: DATABASE_NAME
        value: khoj_production
      - key: FIREBASE_CREDENTIALS_FILE
        value: /etc/secrets/serviceAccountKey.json
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: TELEPHONY_PROVIDER
        value: calle
      - key: CALLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: ADMIN_NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAX_CONCURRENT_CALLS
        value: "3"
      - key: NUMBER_COOLDOWN_DAYS
        value: "7"
      - key: IGNORE_CALL_WINDOW
        value: "false"
      - key: BYPASS_CALL_WINDOW
        value: "false"
