services:
  - type: web
    name: khoj-api
    runtime: python
    plan: starter          
    region: singapore      
    rootDir: backend-py
    branch: main

    # See backend-py/build.sh. It installs Chromium and the OS libraries it
    # links against, then proves the browser launches — because `pip install
    # playwright` provides only the Python client, and a crawler with no
    # browser fails at runtime in the worst possible way: silently, mid-search,
    # after the customer has already been told it is working.
    # Invoked through bash rather than as ./build.sh: the file is authored on
    # Windows, where git does not record an executable bit, and a build that
    # dies on "permission denied" is a poor reward for fixing the browser.
    buildCommand: bash ./build.sh

    # One worker, stated rather than inherited. Render derives WEB_CONCURRENCY
    # from the CPU count, and a second worker would double every resident cost
    # on a 512MB box — the Motor pool, the model clients, and a Chromium the
    # crawler may launch. The instance is then OOM-killed, the platform answers
    # 503 with no CORS headers, and the browser reports a CORS error for a
    # process that is simply dead.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENV
        value: prod
      # Set to the Render URL once the service exists.
      - key: PUBLIC_URL
        sync: false
      # The Vercel origin. CORS is an explicit allowlist, so a wrong value here
      # means every browser request fails preflight.
      - key: FRONTEND_ORIGINS
        sync: false
      # The frontend origin again, and not the same thing as PUBLIC_URL above:
      # this one builds the /verify/<token> link that goes to a broker's phone,
      # so it must point at Vercel, while PUBLIC_URL points at this API for
      # telephony webhooks. It defaults to http://localhost:5173 in config.py,
      # which is correct on a laptop and useless in a text message — a broker
      # taps it and gets nothing, with no error anywhere to explain why.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FIRESTORE_ENTERPRISE_URI
        sync: false
      - key: DATABASE_NAME
        value: khoj_production
      - key: FIREBASE_CREDENTIALS_FILE
        value: /etc/secrets/serviceAccountKey.json
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: TELEPHONY_PROVIDER
        value: calle
      - key: CALLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_REQUIRED
        value: "true"
      - key: ADMIN_NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Live video verification. All three are required together — the server
      # checks for all of them before it will open a room — so a deploy with
      # two of the three set behaves exactly like a deploy with none: the
      # broker is never asked for a video and nothing in the logs says why.
      # `/api/health` reports `livekit_configured` so that is one curl to check
      # rather than a failed verification to notice.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Server-side recording of the session. Off unless the bucket below is
      # set too: egress that cannot write anywhere fails the room, which would
      # cost a live verification to save an artefact of it.
      - key: LIVEKIT_RECORD
        sync: false
      - key: LIVEKIT_RECORDING_BUCKET
        sync: false
      # Twilio, which carries the SMS or WhatsApp holding the verification
      # link. It places no calls — that is CALLE_API_KEY above.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: MAX_CONCURRENT_CALLS
        value: "3"
      - key: NUMBER_COOLDOWN_DAYS
        value: "7"
      # Both default to false in app/config.py, which is the correct production
      # posture: the window keeps us from ringing strangers at odd hours, and
      # the cooldown stops one broker being called by five customers in a week.
      #
      # Declared `sync: false` rather than pinned to "false" here. A literal
      # `value:` is reasserted by the blueprint on every deploy, so toggling
      # either one in the Render dashboard appeared to work and was silently
      # reverted by the next push — which is how a deployed build ended up
      # unable to dial at all while the same code dialled fine from a laptop
      # whose .env set both to true.
      #
      # Leave them unset in the dashboard for normal operation. Set
      # BYPASS_CALL_WINDOW=true only for a live test, and remove it after:
      # it disables the per-number cooldown as well as the hours.
      - key: IGNORE_CALL_WINDOW
        sync: false
      - key: BYPASS_CALL_WINDOW
        sync: false
